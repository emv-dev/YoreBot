name: YoreBot Windows internal build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yorebot-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-internal-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Test Windows acceptance contracts
        shell: pwsh
        run: |
          node --test scripts/tests/windows-acceptance-contracts.test.mjs
          foreach ($script in @(
            "scripts/test-windows-installer.ps1",
            "scripts/test-windows-pinned-model.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              throw "PowerShell syntax errors in $script"
            }
          }

      - name: Install dependencies
        shell: pwsh
        run: yarn install --immutable

      - name: Build core package required by extensions
        shell: pwsh
        run: yarn build:core

      - name: Install extension dependencies
        shell: pwsh
        run: |
          Push-Location extensions
          # core/package.tgz is generated per platform, so Yarn must refresh
          # its local-file checksum in this ephemeral checkout.
          yarn install --no-immutable
          Pop-Location
          $unexpected = @(
            git diff --name-only | Where-Object { $_ -ne "extensions/yarn.lock" }
          )
          if ($unexpected.Count -gt 0) {
            throw "Extension install changed unexpected tracked files: $($unexpected -join ', ')"
          }

      - name: Verify Windows safety contracts
        shell: pwsh
        run: |
          $trayFiles = @(
            ".cargo/config.toml",
            "src-tauri/src/lib.rs",
            "src-tauri/src/core/setup.rs",
            "src-tauri/src/core/tray_status.rs",
            "web-app/src/hooks/useTrayStatusSync.ts"
          )
          $traySource = ($trayFiles | ForEach-Object { Get-Content $_ -Raw }) -join "`n"
          foreach ($forbidden in @(
            "ENABLE_SYSTEM_TRAY_ICON",
            "status_stop",
            "tray-start-server",
            "tray-stop-server",
            "Start Server",
            "Stop Server"
          )) {
            if ($traySource.Contains($forbidden)) {
              throw "Forbidden tray server-control surface remains: $forbidden"
            }
          }

          $hooks = Get-Content "src-tauri/windows/hooks.nsh" -Raw
          foreach ($forbidden in @('$INSTDIR*', '$APPDATA\YoreBot*')) {
            if ($hooks.Contains($forbidden)) {
              throw "Unsafe uninstaller prefix match remains: $forbidden"
            }
          }
          foreach ($required in @(
            "[System.IO.Path]::GetFullPath",
            "-ieq",
            ".StartsWith(",
            "[char]92",
            "[System.StringComparison]::OrdinalIgnoreCase"
          )) {
            if (-not ($hooks.Contains($required))) {
              throw "Uninstaller boundary guard is missing: $required"
            }
          }

          function Test-EqualOrChild([string] $candidate, [string] $root) {
            $canonicalCandidate = [System.IO.Path]::GetFullPath($candidate)
            $canonicalRoot = [System.IO.Path]::GetFullPath($root).TrimEnd([char]92)
            return ($canonicalCandidate -ieq $canonicalRoot) -or
              $canonicalCandidate.StartsWith(
                $canonicalRoot + [char]92,
                [System.StringComparison]::OrdinalIgnoreCase
              )
          }
          if (-not (Test-EqualOrChild "C:\Apps\YoreBot" "C:\Apps\YoreBot")) {
            throw "Exact install root must match"
          }
          if (-not (Test-EqualOrChild "C:\Apps\YoreBot\bin\llama-server.exe" "C:\Apps\YoreBot")) {
            throw "Install child must match"
          }
          if (Test-EqualOrChild "C:\Apps\YoreBot-Evil\llama-server.exe" "C:\Apps\YoreBot") {
            throw "Sibling install path must not match"
          }
          if (Test-EqualOrChild "C:\Users\runneradmin\AppData\Roaming\YoreBot-old\bun.exe" "C:\Users\runneradmin\AppData\Roaming\YoreBot") {
            throw "Sibling data path must not match"
          }

      - name: Install pinned icon build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.3.0

      - name: Verify pinned CPU runtime archive
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/b10431/llama-b10431-bin-win-cpu-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP "llama-b10431-bin-win-cpu-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-Item $archive).Length -ne 18462983) { throw "Pinned runtime size mismatch" }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne "aa16a2102de8730be6079f67f77997ca549e9a07125563571afb2fb4e810ec2c") {
            throw "Pinned runtime SHA-256 mismatch"
          }

          $runtime = "src-tauri/resources/llamacpp-backend-upstream"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Expand-Archive -Path $archive -DestinationPath $runtime -Force
          $server = Join-Path $runtime "llama-server.exe"
          if (Test-Path $server) {
            $bin = Join-Path $runtime "build/bin"
            New-Item -ItemType Directory -Force $bin | Out-Null
            Get-ChildItem $runtime -File | Move-Item -Destination $bin
          }
          "b10431" | Set-Content (Join-Path $runtime "version.txt")
          "win-cpu-x64" | Set-Content (Join-Path $runtime "backend.txt")
          if (-not (Test-Path (Join-Path $runtime "build/bin/llama-server.exe"))) {
            throw "Pinned runtime did not contain llama-server.exe"
          }

      - name: Build existing components
        shell: pwsh
        run: |
          yarn build:tauri:plugin:api
          yarn build:extensions:win32
          yarn download:bin
          yarn copy:assets:tauri
          yarn build:icon
          cargo build --manifest-path src-tauri/Cargo.toml --features cli --bin jan-cli
          Copy-Item src-tauri/target/debug/jan-cli.exe src-tauri/resources/bin/jan-cli.exe

      - name: Test product seams
        shell: pwsh
        run: |
          yarn workspace @janhq/web-app tsc -b --pretty false
          yarn workspace @janhq/web-app test src/constants/yorebot-models.test.ts src/services/deeplink/parse.test.ts src/components/left-sidebar/__tests__/NavMain.test.tsx src/containers/dialogs/AgentApprovalDialog.test.tsx src/containers/__tests__/ChatAgentWorkspace.test.tsx
          Push-Location extensions
          yarn workspace @janhq/llamacpp-upstream-extension test:run src/test/backend.test.ts
          Pop-Location
          yarn build:web
          cargo test --manifest-path src-tauri/Cargo.toml --lib --features test-tauri core::agent::entitlements:: -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --lib --features test-tauri core::agent::runner_tests:: -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --lib --features test-tauri core::agent::tools::contract_tests::denied_mutations_leave_the_workspace_and_desktop_unchanged -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --lib --features test-tauri core::agent::tools::contract_tests::filesystem_move_is_non_overwriting_and_reversible -- --test-threads=1

      - name: Build unsigned internal NSIS installer
        shell: pwsh
        run: yarn tauri build --debug --bundles nsis --ci

      - name: Collect internal NSIS installer
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem "src-tauri/target/debug/bundle/nsis" -Filter "*.exe" -File -Recurse
          )
          if ($installers.Count -eq 0) {
            throw "Unsigned NSIS installer was not produced"
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName (Join-Path "artifacts" $installer.Name)
          }

      - name: Smoke fresh NSIS install and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "artifacts" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          $workRoot = Join-Path $env:RUNNER_TEMP "yorebot-installer-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./scripts/test-windows-installer.ps1 -InstallerPath $installers[0].FullName -WorkRoot $workRoot

      - uses: actions/upload-artifact@v4
        with:
          name: YoreBot-Windows-unsigned-internal
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 7

  pinned-model-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned model on pinned CPU runtime
        shell: pwsh
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP "yorebot-model-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./scripts/test-windows-pinned-model.ps1 -WorkRoot $workRoot
