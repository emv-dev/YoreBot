name: YoreBot Windows signed candidate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SIGN_YOREBOT_WINDOWS_CANDIDATE to accept the Azure signing charge boundary
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: yorebot-windows-signed-candidate
  cancel-in-progress: false

jobs:
  signed-candidate:
    runs-on: windows-latest
    environment: windows-production-signing
    env:
      YOREBOT_SIGNING_CONFIRMATION: ${{ inputs.confirmation }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
      AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
      YOREBOT_WINDOWS_SIGNER_SUBJECT: ${{ vars.YOREBOT_WINDOWS_SIGNER_SUBJECT }}
    steps:
      - name: Refuse unconfigured or unconfirmed signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:YOREBOT_SIGNING_CONFIRMATION -cne 'SIGN_YOREBOT_WINDOWS_CANDIDATE') {
            throw 'Signing was not explicitly confirmed'
          }
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT',
            'AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME',
            'AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME',
            'YOREBOT_WINDOWS_SIGNER_SUBJECT'
          )
          $missing = @(
            $required | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
            }
          )
          if ($missing.Count -gt 0) {
            throw "Required signing variables are missing: $($missing -join ', ')"
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable Yarn
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Install dependencies
        shell: pwsh
        run: yarn install --immutable

      - name: Build core package required by extensions
        shell: pwsh
        run: yarn build:core

      - name: Install extension dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location extensions
          yarn install --no-immutable
          Pop-Location
          $unexpected = @(
            git diff --name-only | Where-Object { $_ -ne 'extensions/yarn.lock' }
          )
          if ($unexpected.Count -gt 0) {
            throw "Extension install changed unexpected tracked files: $($unexpected -join ', ')"
          }

      - name: Install pinned icon build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.3.0

      - name: Prepare exact pinned CPU runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $url = 'https://github.com/ggml-org/llama.cpp/releases/download/b10431/llama-b10431-bin-win-cpu-x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'llama-b10431-bin-win-cpu-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-Item $archive).Length -ne 18462983) {
            throw 'Pinned runtime size mismatch'
          }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne 'aa16a2102de8730be6079f67f77997ca549e9a07125563571afb2fb4e810ec2c') {
            throw 'Pinned runtime SHA-256 mismatch'
          }

          $runtime = 'src-tauri/resources/llamacpp-backend-upstream'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Expand-Archive -Path $archive -DestinationPath $runtime -Force
          $flatServer = Join-Path $runtime 'llama-server.exe'
          if (Test-Path -LiteralPath $flatServer) {
            $bin = Join-Path $runtime 'build/bin'
            New-Item -ItemType Directory -Force $bin | Out-Null
            Get-ChildItem $runtime -File | Move-Item -Destination $bin
          }
          'b10431' | Set-Content (Join-Path $runtime 'version.txt')
          'win-cpu-x64' | Set-Content (Join-Path $runtime 'backend.txt')
          $serverPath = Join-Path $runtime 'build/bin/llama-server.exe'
          if (-not (Test-Path -LiteralPath $serverPath -PathType Leaf)) {
            throw 'Pinned runtime did not contain llama-server.exe'
          }
          Push-Location (Split-Path $serverPath)
          try {
            $versionOutput = (& '.\llama-server.exe' --version 2>&1 | Out-String).Trim()
            $versionExitCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($versionExitCode -ne 0 -or
              $versionOutput -notmatch '(?m)(?:version:\s+b?10431(?:-|\s)|\(build\s+10431,)') {
            throw "Pinned runtime version mismatch: $versionOutput"
          }

      - name: Prepare existing Windows components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          yarn build:tauri:plugin:api
          yarn build:extensions:win32
          yarn download:bin
          yarn copy:assets:tauri
          yarn build:icon
          cargo build --release --manifest-path src-tauri/Cargo.toml --features cli --bin jan-cli
          Copy-Item src-tauri/target/release/jan-cli.exe src-tauri/resources/bin/jan-cli.exe

      - name: Build release app without bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          yarn tauri build --no-bundle --ci
          $cargoManifest = Get-Content 'src-tauri/Cargo.toml' -Raw
          $defaultRun = [regex]::Match($cargoManifest, '(?m)^default-run\s*=\s*"([^"]+)"\s*$')
          if (-not $defaultRun.Success) { throw 'Cargo default-run is missing' }
          $appPath = [System.IO.Path]::GetFullPath(
            (Join-Path 'src-tauri/target/release' "$($defaultRun.Groups[1].Value).exe")
          )
          if (-not (Test-Path -LiteralPath $appPath -PathType Leaf)) {
            throw "Release app executable is missing: $appPath"
          }
          "YOREBOT_APP_EXE=$appPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Azure OIDC login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign main app executable
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release
          files-folder-filter: Atomic-Chat.exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Clear app-signing Azure session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          az logout
          az account clear

      - name: Bundle signed NSIS candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          yarn tauri bundle --bundles nsis --ci
          $installers = @(
            Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -Recurse
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          $installerPath = [System.IO.Path]::GetFullPath($installers[0].FullName)
          "YOREBOT_INSTALLER_EXE=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Azure OIDC login for installer
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NSIS installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle\nsis
          files-folder-filter: "*.exe"
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Clear installer-signing Azure session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          az logout
          az account clear

      - name: Verify signed candidate by fresh install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $workRoot = Join-Path $env:RUNNER_TEMP "yorebot-signed-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./scripts/test-windows-installer.ps1 `
            -InstallerPath $env:YOREBOT_INSTALLER_EXE `
            -WorkRoot $workRoot `
            -ExpectedSignerSubject $env:YOREBOT_WINDOWS_SIGNER_SUBJECT
