name: YoreBot public release (blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  YOREBOT_RELEASE_BASE_URL: https://github.com/emv-dev/YoreBot/releases/download

jobs:
  signing-required:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unsigned public release
        run: |
          echo "Public release is disabled until YoreBot owns its signing certificate and updater key."
          echo "Future release assets belong under ${YOREBOT_RELEASE_BASE_URL}."
          exit 1
